name: Deploy

# A push to develop deploys staging; a push to main deploys production, then tags the commit and
# publishes a GitHub release for it. CI is called as a required gate before deployment. Merging to
# main IS the production approval gate: GitHub's required-reviewer protection rule would be the
# better mechanism, but it needs GitHub Pro/Team while the repository stays private.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options: [staging, production]
        required: true
        default: staging

# Deploys are never cancelled mid-flight: interrupting between the migration step and the Worker
# deploy would leave the schema ahead of the code.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      # A manual run may name its environment; a push takes it from the branch. Production
      # may only ever be deployed from `main`, so neither a manual run against a feature
      # branch nor a renamed branch can reach it.
      - id: pick
        env:
          REQUESTED: ${{ inputs.environment }}
          BRANCH: ${{ github.ref_name }}
        run: |
          RESOLVED="$REQUESTED"
          if [ -z "$RESOLVED" ]; then
            if [ "$BRANCH" = "main" ]; then RESOLVED=production; else RESOLVED=staging; fi
          fi
          if [ "$RESOLVED" = "production" ] && [ "$BRANCH" != "main" ]; then
            echo "::error::Refusing to deploy production from '$BRANCH'. Run this workflow from main."
            exit 1
          fi
          echo "environment=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Deploying to $RESOLVED (ref: $BRANCH)"

  verify:
    name: Verify
    needs: resolve
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate and deploy
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm

      # The successful CI run uses the same key, so this restores rather than reinstalls. See the
      # note in ci.yml for why there are no `restore-keys`.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Capture rollback state
        env:
          RELEASE_STATE_OUTPUT: ${{ runner.temp }}/rollback/${{ env.TARGET_ENV }}.json
        run: |
          node tools/deploy/release-state.mjs capture \
            --environment "$TARGET_ENV" \
            --output "$RELEASE_STATE_OUTPUT"

      - name: Upload rollback state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollback-state-${{ env.TARGET_ENV }}-${{ github.sha }}
          path: ${{ runner.temp }}/rollback
          if-no-files-found: warn
          retention-days: 30

      - name: Check migration compatibility
        run: node tools/deploy/migration-compatibility.mjs check --environment "$TARGET_ENV"

      # Migrations run before any build. The Cloudflare Vite plugin writes a flattened
      # `.wrangler/deploy/config.json` during `vite build`, which redirects later wrangler
      # commands in that directory and makes `--env` invalid — so schema first, then code.
      - name: Apply D1 migrations
        run: npx nx run worker-jobs:migrate:${{ env.TARGET_ENV }}

      - name: Initialize local D1 for prerender build
        if: env.TARGET_ENV == 'staging'
        run: npx nx run worker-jobs:migrate:local

      - name: Initialize production local D1 for prerender build
        if: env.TARGET_ENV == 'production'
        run: npx nx run worker-jobs:migrate:local:production

      # `--parallel=1` keeps the four Workers' logs readable and makes a partial failure
      # unambiguous. apps/ui, apps/dashboard and apps/admin select their environment via
      # CLOUDFLARE_ENV at build time; apps/worker-jobs uses `wrangler deploy --env`.
      - name: Deploy Workers
        run: npx nx run-many -t deploy:${{ env.TARGET_ENV }} --parallel=1 --output-style=stream

      - name: Resolve SEO smoke origin
        id: seo-origin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            echo "origin=https://founders.coffee" >> "$GITHUB_OUTPUT"
            echo "canonical_origin=https://founders.coffee" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          subdomain=$(printf '%s' "$response" | jq -r '.result.subdomain // empty')
          if [ -z "$subdomain" ]; then
            echo "Cloudflare Workers subdomain is missing" >&2
            exit 1
          fi
          echo "origin=https://founders-coffee-ui-staging.$subdomain.workers.dev" >> "$GITHUB_OUTPUT"
          echo "canonical_origin=https://staging.founders.coffee" >> "$GITHUB_OUTPUT"

      - name: Run SEO route smoke
        id: seo-smoke
        env:
          REPORT_DIR: ${{ runner.temp }}/seo
        run: |
          mkdir -p "$REPORT_DIR"
          node tools/seo/smoke.mjs \
            --origin "${{ steps.seo-origin.outputs.origin }}" \
            --canonical-origin "${{ steps.seo-origin.outputs.canonical_origin }}" \
            --output "$REPORT_DIR/seo-route-report.json" \
            --sitemap-output "$REPORT_DIR/sitemap.xml"

      # Only once the smoke has actually run: on a deploy that failed earlier there is no
      # report to upload, and `error` would add a second, misleading failure to the first.
      - name: Upload SEO smoke artifacts
        if: always() && steps.seo-smoke.conclusion != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: seo-${{ env.TARGET_ENV }}-${{ github.sha }}
          path: ${{ runner.temp }}/seo
          if-no-files-found: error
          retention-days: 14

  release:
    name: Tag and release
    needs: [resolve, deploy]
    # Tags and releases are main-only. A manual production run is a redeploy of something already
    # tagged, and tagging it again would claim a version that has no new commits.
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.resolve.outputs.environment == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and every tag: the version is derived from the commits since the
      # last release tag, and a shallow clone would silently make that the wrong set.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Decide the next version
        id: version
        run: node tools/release/next-release.mjs --notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      # The tag is created after the deployment succeeds, so a version that exists is a
      # version that reached production. An empty `version` means main was redeployed with
      # no new commits — there is nothing to tag.
      - name: Tag and publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$TARGET_SHA"
          {
            echo "## Released v$VERSION"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
