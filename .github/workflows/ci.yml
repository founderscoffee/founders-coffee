name: CI

# Runs on every pull request, and is called by deploy.yml as the gate before any
# Cloudflare deploy. There is deliberately no `push` trigger: a push to develop or main
# runs deploy.yml, which calls this workflow, so a `push` trigger here would only duplicate
# the same run. Needs no Cloudflare credentials — the integration tests run against
# Miniflare (real local D1/Queues/Email bindings), not the live account.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, sync, audit, typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      # `nx.json` sets `sync.applyChanges: true`, so local runs silently repair the
      # tsconfig project references. This asserts the repaired state was committed.
      - name: Check Nx tsconfig project references are in sync
        run: npx nx sync:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # `lint` includes the Nx module-boundary rules that enforce the one-directional
      # data flow (AGENTS.md §4), so a boundary violation fails CI here.
      - name: Typecheck, lint, test and build
        run: npx nx run-many -t typecheck lint test build
