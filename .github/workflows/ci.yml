name: CI

# Runs on pull requests and integration pushes. Deploy starts from a successful push run, so
# the full verification is performed once per commit rather than once in CI and again in Deploy.
# Needs no Cloudflare credentials — integration tests use Miniflare (real local bindings), not the
# live account.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, sync, typecheck, lint and test
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      # `node_modules` is about a gigabyte across the root and every workspace, and `npm ci`
      # spends seven minutes on it even with a warm npm cache, because the cost is extraction
      # and linking rather than download. Restoring the tree itself is roughly a minute.
      # Keyed on the exact lockfile and the exact Node version, deliberately without
      # `restore-keys`: a near-miss must reinstall rather than half-populate a tree that
      # `npm ci` would then be skipped for.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      # `nx.json` sets `sync.applyChanges: true`, so local runs silently repair the
      # tsconfig project references. This asserts the repaired state was committed.
      - name: Check Nx tsconfig project references are in sync
        run: npx nx sync:check

      - name: Initialize local D1 for SSR prerender builds
        run: npx nx run worker-jobs:migrate:local

      # `lint` includes the Nx module-boundary rules that enforce the one-directional
      # data flow (AGENTS.md §4), so a boundary violation fails CI here.
      - name: Typecheck, lint and test
        run: npx nx run-many -t typecheck lint test --parallel=1

  build:
    name: Build and Miniflare SEO gate
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Initialize local D1 for SSR prerender builds
        run: npx nx run worker-jobs:migrate:local

      - name: Build
        run: npx nx run-many -t build --parallel=1

      - name: Run Miniflare SEO integration gate
        run: npx nx run public:integration-test
