name: CI

# Runs on every pull request, and is called by deploy.yml as the gate before any
# Cloudflare deploy. There is deliberately no `push` trigger: a push to develop or main
# runs deploy.yml, which calls this workflow, so a `push` trigger here would only duplicate
# the same run. Needs no Cloudflare credentials — the integration tests run against
# Miniflare (real local D1/Queues/Email bindings), not the live account.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, sync, typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      # `node_modules` is about a gigabyte across the root and every workspace, and `npm ci`
      # spends seven minutes on it even with a warm npm cache, because the cost is extraction
      # and linking rather than download. Restoring the tree itself is roughly a minute.
      # Keyed on the exact lockfile and the exact Node version, deliberately without
      # `restore-keys`: a near-miss must reinstall rather than half-populate a tree that
      # `npm ci` would then be skipped for.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      # `nx.json` sets `sync.applyChanges: true`, so local runs silently repair the
      # tsconfig project references. This asserts the repaired state was committed.
      - name: Check Nx tsconfig project references are in sync
        run: npx nx sync:check

      # `lint` includes the Nx module-boundary rules that enforce the one-directional
      # data flow (AGENTS.md §4), so a boundary violation fails CI here.
      - name: Typecheck, lint, test and build
        run: npx nx run-many -t typecheck lint test build
