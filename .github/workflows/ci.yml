name: CI

# Runs on pull requests and reusable verification calls from Deploy. Pushes are owned by the
# deployment workflow so verification runs once as the deployment gate. Needs no Cloudflare
# credentials — integration tests use Miniflare (real local bindings), not the live account.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  reuse-evidence:
    name: Reuse verified staging tree
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
      source_run_url: ${{ steps.lookup.outputs.source_run_url }}
      tree: ${{ steps.lookup.outputs.tree }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - id: target-tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_TREE: ${{ steps.target-tree.outputs.tree }}
        run: node tools/ci/verified-staging-tree.mjs

  quality:
    name: Format, sync, typecheck, lint and test
    needs: reuse-evidence
    if: >-
      always() &&
      needs.reuse-evidence.outputs.reuse != 'true' &&
      (github.event_name != 'pull_request' || github.head_ref != 'develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      # `node_modules` is about a gigabyte across the root and every workspace, and `npm ci`
      # spends seven minutes on it even with a warm npm cache, because the cost is extraction
      # and linking rather than download. Restoring the tree itself is roughly a minute.
      # Keyed on the exact lockfile and the exact Node version, deliberately without
      # `restore-keys`: a near-miss must reinstall rather than half-populate a tree that
      # `npm ci` would then be skipped for.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      # `nx.json` sets `sync.applyChanges: true`, so local runs silently repair the
      # tsconfig project references. This asserts the repaired state was committed.
      - name: Check Nx tsconfig project references are in sync
        run: npx nx sync:check

      - name: Initialize local D1 for SSR prerender builds
        run: npx nx run worker-jobs:migrate:local

      # `lint` includes the Nx module-boundary rules that enforce the one-directional
      # data flow (AGENTS.md §4), so a boundary violation fails CI here.
      - name: Typecheck, lint and test
        run: npx nx run-many -t typecheck lint test --parallel=1

  build:
    name: Build and Miniflare SEO gate
    needs: reuse-evidence
    if: >-
      always() &&
      needs.reuse-evidence.outputs.reuse != 'true' &&
      (github.event_name != 'pull_request' || github.head_ref != 'develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Initialize local D1 for SSR prerender builds
        run: npx nx run worker-jobs:migrate:local

      - name: Build
        run: npx nx run-many -t build --parallel=1

      - name: Run Miniflare SEO integration gate
        run: npx nx run public:integration-test

  verification:
    name: Verification evidence
    needs: [reuse-evidence, quality, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm verification evidence
        env:
          BUILD: ${{ needs.build.result }}
          QUALITY: ${{ needs.quality.result }}
          RELEASE_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.head_ref == 'develop' }}
          REUSE_EVIDENCE: ${{ needs.reuse-evidence.result }}
          REUSED: ${{ needs.reuse-evidence.outputs.reuse }}
          SOURCE_RUN_URL: ${{ needs.reuse-evidence.outputs.source_run_url }}
          SOURCE_TREE: ${{ needs.reuse-evidence.outputs.tree }}
        run: |
          if [ "$REUSED" = "true" ]; then
            if [ "$REUSE_EVIDENCE" != "success" ] || [ "$QUALITY" != "skipped" ] || [ "$BUILD" != "skipped" ] || [ -z "$SOURCE_RUN_URL" ] || [ -z "$SOURCE_TREE" ]; then
              echo "::error::Verified-tree reuse evidence is incomplete."
              exit 1
            fi
            {
              echo "## Reused verified staging tree"
              echo
              echo "Source: $SOURCE_RUN_URL"
              echo "Tree: \`$SOURCE_TREE\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RELEASE_PULL_REQUEST" = "true" ]; then
            if [ "$QUALITY" != "skipped" ] || [ "$BUILD" != "skipped" ]; then
              echo "::error::The develop release pull request must not run duplicate checks."
              exit 1
            fi
            exit 0
          fi
          if [ "$QUALITY" != "success" ] || [ "$BUILD" != "success" ]; then
            echo "::error::Long CI verification did not complete successfully."
            exit 1
          fi
