name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to recover
        type: choice
        options: [staging, production]
        required: true
        default: staging
      ui_version:
        description: UI Worker version id from a rollback-state artifact
        type: string
        required: true
      dashboard_version:
        description: Dashboard Worker version id from a rollback-state artifact
        type: string
        required: true
      admin_version:
        description: Admin Worker version id from a rollback-state artifact
        type: string
        required: true
      worker_jobs_version:
        description: Worker-jobs version id from a rollback-state artifact
        type: string
        required: true
      rollback_state_run_id:
        description: Deploy run id whose rollback-state artifact produced these version ids
        type: string
        required: false
        default: ''
      acknowledge_migration_risk:
        description: Roll back even when the compatibility manifest cannot clear these versions against the live schema
        type: boolean
        required: false
        default: false

concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate rollback request
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ inputs.environment }}
      UI_VERSION: ${{ inputs.ui_version }}
      DASHBOARD_VERSION: ${{ inputs.dashboard_version }}
      ADMIN_VERSION: ${{ inputs.admin_version }}
      WORKER_JOBS_VERSION: ${{ inputs.worker_jobs_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate rollback request
        run: |
          node tools/deploy/release-state.mjs validate-rollback \
            --environment "$TARGET_ENV" \
            --ui-version "$UI_VERSION" \
            --dashboard-version "$DASHBOARD_VERSION" \
            --admin-version "$ADMIN_VERSION" \
            --worker-jobs-version "$WORKER_JOBS_VERSION"

  rollback-workers:
    name: Roll back Workers and verify
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # `actions: read` is what downloading the deploy's rollback-state artifact needs, and all
    # it needs: the evidence is read, never written.
    permissions:
      actions: read
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ inputs.environment }}
      UI_VERSION: ${{ inputs.ui_version }}
      DASHBOARD_VERSION: ${{ inputs.dashboard_version }}
      ADMIN_VERSION: ${{ inputs.admin_version }}
      WORKER_JOBS_VERSION: ${{ inputs.worker_jobs_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify rollback versions exist
        run: |
          node tools/deploy/release-state.mjs verify-targets \
            --environment "$TARGET_ENV" \
            --ui-version "$UI_VERSION" \
            --dashboard-version "$DASHBOARD_VERSION" \
            --admin-version "$ADMIN_VERSION" \
            --worker-jobs-version "$WORKER_JOBS_VERSION"

      # The artifact the deploy captured BEFORE it migrated, so its applied-migration list is the
      # schema these Worker versions actually served. Without it there is no way to tell whether
      # the schema has since moved past them, which is why the check below then refuses.
      - name: Fetch rollback state evidence
        id: rollback-state
        if: inputs.rollback_state_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.rollback_state_run_id }}
          STATE_DIR: ${{ runner.temp }}/rollback-state
        run: |
          head_sha=$(gh run view "$RUN_ID" --json headSha --jq .headSha)
          mkdir -p "$STATE_DIR"
          gh run download "$RUN_ID" --name "rollback-state-$TARGET_ENV-$head_sha" --dir "$STATE_DIR"
          echo "file=$STATE_DIR/$TARGET_ENV.json" >> "$GITHUB_OUTPUT"

      # Refuses before the first `wrangler rollback`, so a refusal leaves the environment exactly
      # as it was rather than half rolled back.
      - name: Check rollback migration compatibility
        env:
          STATE_FILE: ${{ steps.rollback-state.outputs.file }}
          ACKNOWLEDGED: ${{ inputs.acknowledge_migration_risk }}
        run: |
          evidence=()
          if [ -n "$STATE_FILE" ]; then evidence+=(--state-file "$STATE_FILE"); fi
          if [ "$ACKNOWLEDGED" = "true" ]; then evidence+=(--acknowledge); fi
          node tools/deploy/rollback-compatibility.mjs check \
            --environment "$TARGET_ENV" \
            --ui-version "$UI_VERSION" \
            --dashboard-version "$DASHBOARD_VERSION" \
            --admin-version "$ADMIN_VERSION" \
            --worker-jobs-version "$WORKER_JOBS_VERSION" \
            "${evidence[@]}"

      - name: Roll back UI Worker
        run: npx wrangler rollback "$UI_VERSION" --config apps/ui/wrangler.jsonc --env "$TARGET_ENV" --yes --message "P0-020 Worker rollback"

      - name: Roll back dashboard Worker
        run: npx wrangler rollback "$DASHBOARD_VERSION" --config apps/dashboard/wrangler.jsonc --env "$TARGET_ENV" --yes --message "P0-020 Worker rollback"

      - name: Roll back admin Worker
        run: npx wrangler rollback "$ADMIN_VERSION" --config apps/admin/wrangler.jsonc --env "$TARGET_ENV" --yes --message "P0-020 Worker rollback"

      - name: Roll back worker-jobs Worker
        run: npx wrangler rollback "$WORKER_JOBS_VERSION" --config apps/worker-jobs/wrangler.jsonc --env "$TARGET_ENV" --yes --message "P0-020 Worker rollback"

      - name: Resolve SEO smoke origin
        id: seo-origin
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            echo "origin=https://founders.coffee" >> "$GITHUB_OUTPUT"
            echo "canonical_origin=https://founders.coffee" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          subdomain=$(printf '%s' "$response" | jq -r '.result.subdomain // empty')
          if [ -z "$subdomain" ]; then
            echo "Cloudflare Workers subdomain is missing" >&2
            exit 1
          fi
          echo "origin=https://founders-coffee-ui-staging.$subdomain.workers.dev" >> "$GITHUB_OUTPUT"
          echo "canonical_origin=https://staging.founders.coffee" >> "$GITHUB_OUTPUT"

      - name: Run SEO route smoke
        env:
          REPORT_DIR: ${{ runner.temp }}/rollback-smoke
        run: |
          mkdir -p "$REPORT_DIR"
          node tools/seo/smoke.mjs \
            --origin "${{ steps.seo-origin.outputs.origin }}" \
            --canonical-origin "${{ steps.seo-origin.outputs.canonical_origin }}" \
            --output "$REPORT_DIR/seo-route-report.json" \
            --sitemap-output "$REPORT_DIR/sitemap.xml"

      - name: Upload rollback smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollback-smoke-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rollback-smoke
          if-no-files-found: warn
          retention-days: 30
