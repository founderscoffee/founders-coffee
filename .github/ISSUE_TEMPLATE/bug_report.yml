name: Bug report
description: Something in founders.coffee does not work as it should.
type: Bug
labels: ['needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A security problem goes through the [security policy](https://github.com/founderscoffee/founders-coffee/security/policy) instead, never here.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What you did, and what you saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://founders.coffee/ar/algeria
        2. Choose a meetup
        3. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - founders.coffee (production)
        - staging.founders.coffee
        - A local development build
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the page
      multiple: true
      options:
        - Arabic
        - French
        - English
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15 with Safari 18, or Windows 11 with Chrome 140
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues, and this is not a duplicate.
          required: true
        - label: This report contains nobody's phone number, email address, sign-in code or other personal data.
          required: true
